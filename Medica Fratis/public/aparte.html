<!DOCTYPE html>
<html>

<head>
  <title>Monitor de Sensores</title>
  <script src="https://www.gstatic.com/firebasejs/8.6.8/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.6.8/firebase-database.js"></script>
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 20px;
    }

    .sensor-card {
      border: 1px solid #ddd;
      border-radius: 8px;
      padding: 15px;
      margin: 10px 0;
      width: 300px;
    }

    .alert {
      color: red;
      font-weight: bold;
    }

    .relay-on {
      color: green;
    }

    .relay-off {
      color: red;
    }
  </style>
</head>

<body>
  <h1>Monitor de Sensores en Tiempo Real</h1>

  <div class="sensor-card">
    <h3>Temperatura</h3>
    <p id="temperature">-- °C</p>
  </div>

  <div class="sensor-card">
    <h3>Humedad</h3>
    <p id="humidity">-- %</p>
  </div>

  <div class="sensor-card">
    <h3>Nivel de Gas</h3>
    <p id="gas">--</p>
  </div>

  <div class="sensor-card">
    <h3>Caudal</h3>
    <p id="flowRate">-- L/min</p>
    <p>Total: <span id="totalFlow">--</span> litros</p>
  </div>

  <div class="sensor-card">
    <h3>Estado del Relé</h3>
    <p id="relayStatus">--</p>
  </div>

  <div class="sensor-card" id="alertBox" style="display: none;">
    <h3>¡ALERTA!</h3>
    <p id="alertMessage"></p>
  </div>

  <script>
    // Configuración Firebase
    const firebaseConfig = {
      apiKey: "AIzaSyCXKWpkb5rR8WFss0PyVwExjLrO_OI30Tg",
      authDomain: "prueba-5a1c4.firebaseapp.com",
      projectId: "prueba-5a1c4",
      storageBucket: "prueba-5a1c4.firebasestorage.app",
      messagingSenderId: "186842339356",
      appId: "1:186842339356:web:6cc8811965afe7c84d67d9"
    };

    // Inicializar Firebase
    firebase.initializeApp(firebaseConfig);
    const database = firebase.database();

    // Referencias a los datos
    const tempRef = database.ref('sensors/temperature');
    const humidityRef = database.ref('sensors/humidity');
    const gasRef = database.ref('sensors/gas');
    const flowRateRef = database.ref('sensors/flow_rate');
    const totalFlowRef = database.ref('sensors/total_flow');
    const relayRef = database.ref('relay/status');
    const alertRef = database.ref('alerts/last_alert');

    // Actualizar datos en tiempo real
    tempRef.on('value', (snapshot) => {
      document.getElementById('temperature').textContent = snapshot.val() + ' °C';
    });

    humidityRef.on('value', (snapshot) => {
      document.getElementById('humidity').textContent = snapshot.val() + ' %';
    });

    gasRef.on('value', (snapshot) => {
      document.getElementById('gas').textContent = snapshot.val();
      if (snapshot.val() > 300) {
        document.getElementById('gas').className = 'alert';
      } else {
        document.getElementById('gas').className = '';
      }
    });

    flowRateRef.on('value', (snapshot) => {
      document.getElementById('flowRate').textContent = snapshot.val().toFixed(2) + ' L/min';
    });

    totalFlowRef.on('value', (snapshot) => {
      document.getElementById('totalFlow').textContent = snapshot.val().toFixed(2);
    });

    relayRef.on('value', (snapshot) => {
      const statusElement = document.getElementById('relayStatus');
      if (snapshot.val()) {
        statusElement.textContent = 'ENCENDIDO';
        statusElement.className = 'relay-on';
      } else {
        statusElement.textContent = 'APAGADO';
        statusElement.className = 'relay-off';
      }
    });

    alertRef.on('value', (snapshot) => {
      const alertBox = document.getElementById('alertBox');
      const alertMsg = document.getElementById('alertMessage');

      if (snapshot.val()) {
        alertMsg.textContent = snapshot.val();
        alertBox.style.display = 'block';
      } else {
        alertBox.style.display = 'none';
      }
    });
  </script>
</body>

</html>
