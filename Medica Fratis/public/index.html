<!DOCTYPE html>
<html lang="es">
<head>
  <!-- Metadatos para codificación y diseño responsivo -->
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Iniciar sesión</title>

  <!-- Hojas de estilo -->
  <link rel="stylesheet" href="./css/style-login.css" /> <!-- Estilo personalizado del login -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.6/dist/css/bootstrap.min.css" /> <!-- Bootstrap -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css" /> <!-- Iconos de Bootstrap -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/toastify-js/src/toastify.min.css" /> <!-- Notificaciones estilo Toastify -->
  <link rel="icon" href="./favicon.ico" type="image/x-icon" /> <!-- Icono del navegador -->

  <!-- Scripts -->
  <script type="module" src="./js/main.js"></script> <!-- Script general de la app -->
  <script type="module" src="./app/loginform.js"></script> <!-- Script específico para la funcionalidad del formulario de login -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.6/dist/js/bootstrap.bundle.min.js"></script> <!-- JS de Bootstrap -->
  <script src="https://cdn.jsdelivr.net/npm/toastify-js"></script> <!-- Toastify para mensajes -->
</head>

<body class="d-flex justify-content-center align-items-center vh-100 bg-light">
  <!-- Formulario de login -->
  <form id="login-form">
    <div id="login-container" class="p-4 rounded shadow w-100" style="max-width: 400px;">
      <h2 class="text-center mb-4">Iniciar sesión</h2>

      <!-- Campo de correo -->
      <div class="mb-3">
        <label for="email" class="form-label">Correo electrónico</label>
        <input type="email" class="form-control" id="login-email" placeholder="email.com" autocomplete="email" required>
      </div>

      <!-- Campo de contraseña -->
      <div class="mb-3">
        <label for="password" class="form-label">Contraseña</label>
        <input type="password" class="form-control" id="login-password" placeholder="********" autocomplete="current-password" required>
      </div>

      <!-- Botón de envío -->
      <div class="d-grid">
        <button type="submit" class="btn btn-primary" style="background-color: #03030796; border: none;">Ingresar</button>
      </div>
    </div>
  </form>

  <!-- Botón flotante para personalizar el fondo -->
  <button type="button" class="btn text-white position-fixed d-flex align-items-center gap-2"
    data-bs-toggle="modal" data-bs-target="#staticBackdrop"
    style="bottom: 20px; right: 20px; background-color: #2d3436; border: none; outline: none; box-shadow: 0 4px 8px rgba(0,0,0,0.3);">
    <i class="bi bi-brush"></i> Personalizar
  </button>

  <!-- Modal para selección de fondo -->
  <div class="modal fade" id="staticBackdrop" data-bs-backdrop="static" data-bs-keyboard="false" tabindex="-1"
    aria-labelledby="staticBackdropLabel" aria-hidden="true">
    <div class="modal-dialog">
      <div class="modal-content bg-dark text-white">
        <div class="modal-header border-0">
          <h1 class="modal-title fs-5" id="staticBackdropLabel">Selecciona un fondo</h1>
          <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
        </div>

        <!-- Galería de fondos -->
        <div class="modal-body">
          <div class="row g-2">
            <!-- Cada imagen tiene un atributo data-bg que indica el fondo a aplicar -->
            <div class="col-4"><img src="./img/wallpapers/fondo.jpg" class="img-fluid rounded background-option" data-bg="./img/wallpapers/fondo.jpg"></div>
            <div class="col-4"><img src="./img/wallpapers/fondo2.jpg" class="img-fluid rounded background-option" data-bg="./img/wallpapers/fondo2.jpg"></div>
            <div class="col-4"><img src="./img/wallpapers/fondo3.jpg" class="img-fluid rounded background-option" data-bg="./img/wallpapers/fondo3.jpg"></div>
            <div class="col-4"><img src="./img/wallpapers/fondo4.jpg" class="img-fluid rounded background-option" data-bg="./img/wallpapers/fondo4.jpg"></div>
            <div class="col-4"><img src="./img/wallpapers/fondo5.jpg" class="img-fluid rounded background-option" data-bg="./img/wallpapers/fondo5.jpg"></div>
            <div class="col-4"><img src="./img/wallpapers/fondo6.jpg" class="img-fluid rounded background-option" data-bg="./img/wallpapers/fondo6.jpg"></div>
          </div>

          <hr class="border-light">

          <!-- Opción para subir una imagen personalizada -->
          <div class="col-4 mt-3">
            <label for="custom-bg-upload" class="w-100 d-flex justify-content-center align-items-center border border-secondary rounded"
              style="height: 100px; cursor: pointer;">
              <i class="bi bi-plus-lg fs-2 text-secondary"></i>
              <input type="file" id="custom-bg-upload" class="d-none" accept="image/*">
            </label>
          </div>
        </div>

        <!-- Botones de cierre y aceptación -->
        <div class="modal-footer border-0">
          <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cerrar</button>
          <button id="acceptBtn" type="button" class="btn btn-primary">Aceptar</button>
        </div>
      </div>
    </div>
  </div>

  <!-- ============================================= -->
  <!-- SECCIÓN PARA AGREGAR NUEVO CÓDIGO O FUNCIONALIDAD -->
  <!-- === NUEVA FUNCIONALIDAD: [Descripción] === -->
  <!-- ============================================= -->

</body>
</html>
<!-- Fin del documento HTML -->   
<!--
  Este es un formulario de inicio de sesión que permite a los usuarios ingresar su correo electrónico y contraseña.
  Incluye un botón para personalizar el fondo de la página con una galería de imágenes predefinidas o una imagen personalizada.
  Utiliza Bootstrap para el diseño responsivo y Toastify para notificaciones.
